aws:
  access-key: ${AWS_ACCESS_KEY:testKey}
  secret-key: ${AWS_SECRET_KEY:secretKey}
  ses:
    region: ${AWS_SES_REGION:ap-northeast-2}
    verified-email: ${AWS_SES_VERIFIED_EMAIL:}
  s3:
    bucket: ${AWS_S3_BUCKET:bucket}
    private-bucket : ${AWS_S3_BUCKET_PRIVATE:bucket-private}
    base-url: ${AWS_S3_BASE_URL:base-url}
ncp:
  access-key: ${NCP_ACCESS_KEY}
  secret-key: ${NCP_SECRET_KEY}
  sender-address: ${NCP_SENDER_ADDRESS:}
  mail-base-url: ${NCP_MAIL_BASE_URL:https://mail.apigw.gov-ntruss.com}
  mail-api-url: ${NCP_MAIL_POST_URI:/api/v1/mails}
  sms-base-url: ${NCP_SMS_BASE_URL:https://sms.apigw.gov-ntruss.com}
  sms-api-uri: ${NCP_SMS_POST_URI}
  from-phone-number: ${NCP_FROM_PHONE_NUMBER}
commons:
  email:
    host: ${COMMONS_EMAIL_HOST:smtp.naver.com}
    port: 587
    sender-name: ${COMMONS_EMAIL_SENDER_USERNAME:econovation_recruit}
    sender-address: ${COMMONS_EMAIL_SENDER_ADDRESS:whdals011203@naver.com}
    password: ${COMMONS_EMAIL_PASSWORD:}
spring:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.naver.com}
    port: 587
    username: ${GMAIL_ADDRESS:}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL:}
    channel: ${SLACK_SERVICE_CHANNEL_ID:}
    username: ${SLACK_WEBHOOK_USERNAME:RecruitBot}
    icon-url: ${SLACK_WEBHOOK_ICON_URL:}

---
spring:
  config:
    activate:
      on-profile: dev
---
spring:
  config:
    activate:
      on-profile: prod
name: 서비스 배포

on:
  workflow_call:
    secrets:
      SSH_HOST:
        required: true
      SSH_USERNAME:
        required: true
      SSH_PASSWORD:
        required: true
      SSH_PORT:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      DISCORD_WEBHOOK_URL:
        required: true
    inputs:
      environment:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      spring-profile-active:
        required: true
        type: string
      image-name:
        required: true
        type: string
      service-name:
        required: true
        type: string

env:
  IMAGE_TAG: 'latest'
  ACTIVE_PROFILE: ${{ inputs.spring-profile-active || 'local' }}
  ENVIRONMENT: ${{ inputs.environment || 'local' }}

jobs:
  deploy:
    runs-on: [ ubuntu-latest ]
    name: 서비스 배포하기
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: GitHub 에서 레포 받아오기
        uses: actions/checkout@v3

      - name: 배포 스크립트 실행
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ./econo-recruit/server
            
            git fetch origin                                  # branch 이력 가져오기
            git reset --hard origin/develop                    # develop branch로 이동 
            
            chmod +x ./econo-recruit-start.sh
            
            ./econo-recruit-start.sh

      - name: 배포 완료 디스코드 알림 보내기
        run: |
          # GitHub Actions 변수 및 현재 커밋 메시지 가져오기
          BRANCH_NAME="${{ github.ref }}"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # JSON Payload 생성
          DATA=$(cat <<EOF
          {
            "username": "🔔배포 알리미🔔",
            "avatar_url": "https://i.namu.wiki/i/X6s5AIfkjae-h54b7EkMYVg7ityFni1B-YIhtck0g6P914sJTsjykJDEbrsoZdV8rmwmrcyioAH3d2CxLmjxLx20dpHZI1izwMjfs7Dvtuchchyt2HDu7iQyy02_QaU6b8RrxWBt4G0PMQ0IZTykpQ.webp",
            "embeds": [
              {
                "title": "배포가 성공했어요~",
                "type": "rich",
                "color": 123456,
                "author": {
                  "name": "칠가이",
                  "icon_url": "https://i.namu.wiki/i/X6s5AIfkjae-h54b7EkMYVg7ityFni1B-YIhtck0g6P914sJTsjykJDEbrsoZdV8rmwmrcyioAH3d2CxLmjxLx20dpHZI1izwMjfs7Dvtuchchyt2HDu7iQyy02_QaU6b8RrxWBt4G0PMQ0IZTykpQ.webp"
                },
                "fields": [
                  {
                    "name": "커밋 메시지",
                    "value": "$COMMIT_MESSAGE",
                    "inline": false
                  },
                  {
                    "name": "브랜치",
                    "value": "$BRANCH_NAME",
                    "inline": true
                  },
                  {
                    "name": "배포 환경",
                    "value": "`Prod`",
                    "inline": true
                  },
                  {
                    "name": "GitHub Actions",
                    "value": "[배포 워크플로우 실행 확인]($WORKFLOW_URL)",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "배포 시각",
                  "icon_url": "https://cdn-icons-png.flaticon.com/512/25/25231.png"
                },
                "timestamp": "$TIMESTAMP"
              }
            ]
          }
          EOF
          )

          # JSON 데이터 출력 (디버깅 용도)
          echo "===== JSON PAYLOAD ====="
          echo "$DATA"
          echo "========================"

          # Discord Webhook 호출
          curl -X POST -H "Content-Type: application/json" -d "$DATA" "${{ secrets.DISCORD_WEBHOOK_URL }}"
